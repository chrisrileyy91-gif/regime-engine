# Run the regime engine once and publish the phone page to GitHub Pages.
#
# Called by regime-morning.yml (06:00 NY) and regime-close.yml (16:25 NY), which meridian-clock
# dispatches on weekdays. Two caller files exist because the clock fires each workflow file at
# most once per NY day ("any run today means skip"). Can also be run by hand from Actions.
#
# State lives as assets on the "snapshots" release, never in git: regime.json (last read),
# history.json (rolling reads) and krx_cache.json (official KRX closes, one API call per date).
#
# Secrets (repo settings): APCA_API_KEY_ID, APCA_API_SECRET_KEY (consolidated-tape closes),
# EODHD_API_KEY (optional: Korea end-of-day, live FX for the dollar index), KRX_API_KEY
# (optional: official Korea history check), ANTHROPIC_API_KEY (last-resort gap filler, capped
# by CLAUDE_MONTHLY_BUDGET_USD), DISCORD_PHEME_WEBHOOK (alerts). Each is optional: without it,
# the matching inputs show as unavailable and Pheme stays silent.
name: Publish regime (shared)

on:
  workflow_call:
    secrets:
      APCA_API_KEY_ID:
        required: false
      APCA_API_SECRET_KEY:
        required: false
      KRX_API_KEY:
        required: false
      EODHD_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      DISCORD_PHEME_WEBHOOK:
        required: false
      SEC_USER_AGENT:
        required: false
  workflow_dispatch:

permissions:
  contents: write   # update the snapshots release assets
  pages: write      # publish to GitHub Pages
  id-token: write   # required by the Pages deployment

env:
  RELEASE: snapshots

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Restore previous snapshot, history and KRX cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            # The release exists, so a failed download must stop the run rather than
            # publish over the stored history with an empty one.
            assets=$(gh release view "$RELEASE" --json assets -q '.assets[].name')
            for f in regime.json history.json krx_cache.json claude_usage.json sec_cache.json claude_fills.json; do
              if grep -qx "$f" <<< "$assets"; then
                gh release download "$RELEASE" --pattern "$f" --dir state --clobber
              fi
            done
          else
            echo "::warning::No '$RELEASE' release yet; starting fresh."
            gh release create "$RELEASE" --title "Snapshots" \
              --notes "Latest regime read, rolling history and KRX cache, updated by the publish workflow. Not a software release."
          fi

      - name: Run the engine
        id: engine
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m app.snapshot --state state --site site

      - name: Save snapshot, history, caches and Claude spend ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE" state/regime.json state/history.json state/krx_cache.json \
            state/claude_usage.json state/sec_cache.json state/claude_fills.json --clobber

      - name: Alert Pheme if the read is degraded, stale or missing
        if: always()
        env:
          DISCORD_PHEME_WEBHOOK: ${{ secrets.DISCORD_PHEME_WEBHOOK }}
          RUN_CONTEXT: ${{ github.workflow }}
        run: |
          if [ "${{ steps.engine.outcome }}" = "success" ]; then
            python -m app.alert site/regime.json
          else
            python -m app.alert /nonexistent.json
          fi

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Regime publish"
            if [ -f site/regime.json ]; then
              python -c "import json;d=json.load(open('site/regime.json'));q=d.get('data_quality') or {};c=d.get('cycle') or {};print(f\"**{d['phase']}** since {c.get('since')} (filings through {c.get('through')}) · today {d['risk_level']} · data {q.get('status')} · stale {d['stale']}\");print();print(d.get('diagnosis',''));print();[print(f\"- {i['status']} {i['label']}: {i['value']} ({i['date']}, {i['source']})\") for i in q.get('inputs',[])]"
            else
              echo "No snapshot written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
