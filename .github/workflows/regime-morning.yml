# Morning read, 06:00 New York, dispatched by meridian-clock (schedule.json).
# Finalizes the prior US session from official sources and picks up the overnight Korea session.
# Do not add a `schedule:` block: the clock counts any run today as "already ran".
name: Regime (morning)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regime-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    secrets: inherit
